# Batch inference workflow: score new data with the registered model and write
# predictions to an inference table (used later by monitoring).
# Docs: Score with Feature Store (score_batch) https://learn.microsoft.com/azure/databricks/machine-learning/feature-store/train-models-with-feature-store
resources:
  jobs:
    batch_inference_job:
      name: ${bundle.target}-databricks-mlops-workshop-batch-inference
      tasks:
        - task_key: batch_inference
          notebook_task:
            notebook_path: ../${var.code_root}/deployment/batch_inference/notebooks/batch_inference.py
            base_parameters:
              model_name: ${var.model_name}
              catalog_name: ${var.catalog_name}
              gold_schema: ${var.gold_schema}
              ml_schema: ${var.ml_schema}
