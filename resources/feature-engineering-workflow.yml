# Feature engineering workflow: silver -> gold features written to the Unity Catalog
# Feature Store. Covers the "Model Development" session (feature access).
# Bronze/silver preparation is handled separately by resources/data-ingestion-workflow.yml.
# Docs: Feature Engineering in Unity Catalog https://learn.microsoft.com/azure/databricks/machine-learning/feature-store/
resources:
  jobs:
    feature_engineering_job:
      name: ${bundle.target}-mlops-workshop-feature-engineering
      tasks:
        - task_key: silver_to_gold_features
          notebook_task:
            notebook_path: ../${var.code_root}/feature_engineering/notebooks/silver_to_gold_features.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              gold_schema: ${var.gold_schema}
              user_schema: ${resources.schemas.user_workspace.name}
